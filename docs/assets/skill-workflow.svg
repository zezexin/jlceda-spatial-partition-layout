<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">嘉立创 EDA Skill v2.1.0</title>
  <desc id="desc">嘉立创 EDA Skill 展示图：空间预演、功能分区、规范连线和自动终检，帮助原理图更清晰规范。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#19345b" flood-opacity=".10"/></filter>
    <style>
      .font{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}
      .title{font-size:44px;font-weight:800;fill:#152b4b;letter-spacing:.2px}
      .subtitle{font-size:22px;fill:#5b6f8b}
      .tag{font-size:16px;font-weight:700;fill:#29415f}
      .blocktitle{font-size:16px;font-weight:800}
      .wire{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .pin{fill:#fff;stroke-width:2}
      .small{font-size:13px;fill:#7587a0}
    </style>
  </defs>
  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1340" cy="20" r="150" fill="#dbeafe" opacity=".55"/>
  <circle cx="1260" cy="480" r="170" fill="#ede9fe" opacity=".55"/>
  <g class="font">
    <!-- brand mark -->
    <rect x="64" y="62" width="76" height="76" rx="22" fill="url(#brand)"/>
    <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 88 H98 V76 H119"/><path d="M84 111 H104 V99 H120"/>
      <circle cx="82" cy="88" r="5" fill="#fff"/><circle cx="121" cy="76" r="5" fill="#fff"/><circle cx="82" cy="111" r="5" fill="#fff"/><circle cx="122" cy="99" r="5" fill="#fff"/>
    </g>
    <text x="164" y="103" class="title">嘉立创 EDA Skill</text>
    <rect x="530" y="72" width="92" height="31" rx="15.5" fill="#dbeafe"/>
    <text x="576" y="93" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">v2.1.0</text>
    <text x="66" y="182" class="subtitle">让原理图布局更清晰、更规范</text>
    <text x="66" y="218" font-size="16" fill="#71829a">从空间规划到整洁交付，专注可读性与一致性</text>

    <!-- Four showcase capabilities -->
    <g filter="url(#shadow)">
      <rect x="66" y="274" width="190" height="76" rx="18" fill="#fff" stroke="#d9e5f5"/>
      <rect x="268" y="274" width="190" height="76" rx="18" fill="#fff" stroke="#d9e5f5"/>
      <rect x="470" y="274" width="190" height="76" rx="18" fill="#fff" stroke="#d9e5f5"/>
      <rect x="672" y="274" width="190" height="76" rx="18" fill="#fff" stroke="#d9e5f5"/>
    </g>
    <g>
      <circle cx="94" cy="312" r="14" fill="#dbeafe"/><path d="M88 304 H98 L102 308 V320 H88 Z M98 304 V309 H102" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="118" y="318" class="tag">空间预演</text>
      <circle cx="296" cy="312" r="14" fill="#dcfce7"/><rect x="288" y="304" width="7" height="7" rx="1" fill="none" stroke="#16a34a" stroke-width="1.8"/><rect x="298" y="304" width="7" height="7" rx="1" fill="none" stroke="#16a34a" stroke-width="1.8"/><rect x="288" y="314" width="7" height="7" rx="1" fill="none" stroke="#16a34a" stroke-width="1.8"/><rect x="298" y="314" width="7" height="7" rx="1" fill="none" stroke="#16a34a" stroke-width="1.8"/>
      <text x="320" y="318" class="tag">功能分区</text>
      <circle cx="498" cy="312" r="14" fill="#f3e8ff"/><path d="M489 312 H495 V305 H504 V319 H508" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="489" cy="312" r="2.6" fill="#fff" stroke="#9333ea" stroke-width="1.6"/><circle cx="508" cy="319" r="2.6" fill="#fff" stroke="#9333ea" stroke-width="1.6"/>
      <text x="522" y="318" class="tag">规范连线</text>
      <circle cx="700" cy="312" r="14" fill="#ffedd5"/><circle cx="700" cy="312" r="8" fill="none" stroke="#ea580c" stroke-width="2"/><path d="M695 312 L699 316 L706 307" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="724" y="318" class="tag">自动终检</text>
    </g>
    <rect x="66" y="388" width="796" height="58" rx="16" fill="#152b4b"/>
    <circle cx="94" cy="417" r="8" fill="#34d399"/>
    <text x="116" y="423" font-size="17" font-weight="700" fill="#fff">可读性优先</text>
    <line x1="263" y1="404" x2="263" y2="430" stroke="#546982"/>
    <text x="286" y="423" font-size="17" font-weight="700" fill="#fff">空间不足时增加页面</text>
    <line x1="529" y1="404" x2="529" y2="430" stroke="#546982"/>
    <text x="552" y="423" font-size="17" font-weight="700" fill="#fff">器件连线完成后再画分区框</text>

    <!-- Simple schematic illustration -->
    <g filter="url(#shadow)">
      <rect x="926" y="64" width="450" height="382" rx="24" fill="#fff" stroke="#d7e3f3"/>
    </g>
    <text x="958" y="101" font-size="15" font-weight="800" fill="#7789a2" letter-spacing="1.1">SCHEMATIC LAYOUT</text>
    <text x="958" y="131" font-size="23" font-weight="800" fill="#203755">Clean &amp; structured</text>
    <!-- Three region boxes -->
    <rect x="957" y="161" width="176" height="104" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="1147" y="161" width="197" height="104" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="957" y="282" width="187" height="128" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <rect x="1158" y="282" width="186" height="128" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="972" y="183" class="blocktitle" fill="#15803d">POWER</text>
    <text x="1162" y="183" class="blocktitle" fill="#2563eb">MCU / I-O</text>
    <text x="972" y="304" class="blocktitle" fill="#c2410c">INTERFACE</text>
    <text x="1173" y="304" class="blocktitle" fill="#7e22ce">DISPLAY</text>
    <!-- simplified circuit symbols -->
    <g class="wire" stroke="#16a34a"><path d="M973 218 H996 V235 H1012 M1035 235 H1050 V214 H1075 H1113"/><path d="M1020 227 V243 M1028 227 V243"/><path d="M1082 206 V222 M1090 206 V222"/></g>
    <rect x="1012" y="225" width="23" height="20" rx="3" fill="#fff" stroke="#16a34a" stroke-width="2"/><circle cx="973" cy="218" r="3.5" fill="#16a34a"/><circle cx="1113" cy="214" r="3.5" fill="#16a34a"/>
    <g class="wire" stroke="#3b82f6"><path d="M1162 220 H1181 V239 H1204 M1232 239 H1251 V213 H1271 M1299 213 H1327"/><path d="M1204 230 V248 M1232 230 V248"/></g>
    <rect x="1204" y="224" width="28" height="30" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="2"/><circle cx="1162" cy="220" r="3.5" fill="#3b82f6"/><circle cx="1327" cy="213" r="3.5" fill="#3b82f6"/>
    <g class="wire" stroke="#f97316"><path d="M974 339 H992 V360 H1010 M1035 360 H1053 V340 H1080 M1102 340 H1125"/><path d="M1014 351 V369 M1022 351 V369"/></g>
    <rect x="1010" y="350" width="25" height="20" rx="3" fill="#fff" stroke="#f97316" stroke-width="2"/><circle cx="974" cy="339" r="3.5" fill="#f97316"/><circle cx="1125" cy="340" r="3.5" fill="#f97316"/>
    <g class="wire" stroke="#a855f7"><path d="M1174 340 H1193 V359 H1210 M1234 359 H1253 V340 H1270 M1293 340 H1326"/><path d="M1212 349 V368 M1220 349 V368"/></g>
    <rect x="1210" y="349" width="24" height="20" rx="3" fill="#fff" stroke="#a855f7" stroke-width="2"/><circle cx="1174" cy="340" r="3.5" fill="#a855f7"/><circle cx="1326" cy="340" r="3.5" fill="#a855f7"/>
    <text x="1150" y="473" class="small" text-anchor="middle">Plan · Place · Connect · Verify</text>
  </g>
</svg>
